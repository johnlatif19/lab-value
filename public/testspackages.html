<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="تصفح التحاليل والباقات وأسعارها من فاليو لاب." />
  <meta name="theme-color" content="#1a222c" />
  <title>التحاليل والباقات | فاليو لاب - Value Lab</title>
  <link rel="icon" href="https://i.ibb.co/Q32HdtCF/image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/testspackages.css" />
</head>
<body>

  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand">
        <img src="https://i.ibb.co/Q32HdtCF/image.jpg" alt="Value Lab" class="brand-logo" />
        <span class="brand-name">فاليو لاب<small>Value Lab</small></span>
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="القائمة" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav-links" id="navLinks">
        <a href="/">الرئيسية</a>
        <a href="/testspackages" class="active">التحاليل والباقات</a>
        <a href="/result">النتائج</a>
        <a href="/points">النقاط</a>
        <a href="/profile">حسابي</a>
        <button class="btn btn-outline" id="logoutBtn" type="button">خروج</button>
      </nav>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <main class="container main">

    <div class="page-head">
      <div>
        <h1>التحاليل والباقات</h1>
        <p class="sub">تصفح كل التحاليل المتاحة والباقات المجمعة وأسعارها.</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="tests" role="tab" aria-selected="true">التحاليل</button>
      <button class="tab" data-tab="packages" role="tab" aria-selected="false">الباقات</button>
    </div>

    <!-- Filters -->
    <section class="filters-bar">
      <label class="search">
        <span class="sr-only">ابحث</span>
        <input id="searchInput" type="search" placeholder="ابحث باسم التحليل أو الباقة..." autocomplete="off" />
      </label>

      <select id="categoryFilter" aria-label="فلترة التصنيف">
        <option value="">كل التصنيفات</option>
      </select>

      <select id="sortFilter" aria-label="ترتيب">
        <option value="default">افتراضي</option>
        <option value="price-asc">السعر: من الأقل للأعلى</option>
        <option value="price-desc">السعر: من الأعلى للأقل</option>
        <option value="name-asc">الاسم: أ - ي</option>
      </select>
    </section>

    <!-- Results grid -->
    <section id="itemsGrid" class="grid" aria-live="polite">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </section>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state hidden">
      <h3>لا توجد نتائج</h3>
      <p>مفيش حاجة مطابقة لبحثك. جرب تغيير الفلاتر أو كلمة البحث.</p>
    </div>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 فاليو لاب — Value Lab. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <!-- ===== Auth guard أولًا ===== -->
  <script src="/public/js/core/auth-guard.js"></script>
  <script src="/public/js/testspackages.js" defer></script>
</body>
</html>
