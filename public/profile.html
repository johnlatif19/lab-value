<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="إدارة بيانات حسابك في فاليو لاب." />
  <meta name="theme-color" content="#1a222c" />
  <title>حسابي | فاليو لاب - Value Lab</title>
  <link rel="icon" href="https://i.ibb.co/Q32HdtCF/image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/profile.css" />
</head>
<body>

  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand">
        <img src="https://i.ibb.co/Q32HdtCF/image.jpg" alt="Value Lab" class="brand-logo" />
        <span class="brand-name">فاليو لاب<small>Value Lab</small></span>
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="القائمة" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav-links" id="navLinks">
        <a href="/">الرئيسية</a>
        <a href="/testspackages">التحاليل</a>
        <a href="/result">النتائج</a>
        <a href="/points">النقاط</a>
        <a href="/profile" class="active">حسابي</a>
        <button class="btn btn-outline" id="logoutBtn" type="button">خروج</button>
      </nav>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <main class="container main">

    <div class="page-head">
      <div class="profile-head">
        <div class="avatar" id="profileAvatar">؟</div>
        <div>
          <h1 id="profileName">—</h1>
          <p class="sub" id="profileUsername">@—</p>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="info" role="tab" aria-selected="true">البيانات الشخصية</button>
      <button class="tab" data-tab="security" role="tab" aria-selected="false">الأمان</button>
      <button class="tab" data-tab="orders" role="tab" aria-selected="false">طلباتي</button>
      <button class="tab" data-tab="results" role="tab" aria-selected="false">نتائجي</button>
      <button class="tab" data-tab="visits" role="tab" aria-selected="false">زياراتي</button>
    </div>

    <!-- ===== Section: info ===== -->
    <section class="section active" data-section="info">
      <div class="panel">
        <div class="panel-head"><h2>البيانات الشخصية</h2></div>
        <form id="infoForm" class="form" novalidate>
          <div class="grid-2">
            <label><span>الاسم الأول</span><input name="firstName" type="text" required /></label>
            <label><span>اسم العائلة</span><input name="lastName" type="text" required /></label>
          </div>

          <div class="grid-2">
            <label><span>اسم المستخدم</span><input name="username" type="text" readonly class="readonly" /></label>
            <label><span>رقم الهاتف</span><input name="phone" type="tel" required /></label>
          </div>

          <label><span>البريد الإلكتروني</span><input name="email" type="email" required /></label>

          <div class="grid-2">
            <label><span>النوع</span>
              <select name="gender" required>
                <option value="">اختر</option>
                <option value="male">ذكر</option>
                <option value="female">أنثى</option>
              </select>
            </label>
            <label><span>تاريخ الميلاد</span><input name="dob" type="date" required /></label>
          </div>

          <div class="fieldset-title">العنوان</div>
          <div class="grid-2">
            <label><span>المدينة</span><input name="city" type="text" required /></label>
            <label><span>المنطقة</span><input name="area" type="text" required /></label>
          </div>
          <label><span>الشارع</span><input name="street" type="text" required /></label>
          <div class="grid-3">
            <label><span>المبنى</span><input name="building" type="text" required /></label>
            <label><span>الشقة</span><input name="apartment" type="text" required /></label>
            <label><span>الطابق</span><input name="floor" type="text" required /></label>
          </div>

          <button type="submit" class="btn btn-primary" id="infoBtn">حفظ التعديلات</button>
          <p class="msg" id="infoMsg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <!-- ===== Section: security ===== -->
    <section class="section" data-section="security">
      <div class="panel">
        <div class="panel-head"><h2>تغيير كلمة السر</h2></div>
        <form id="passwordForm" class="form" novalidate>
          <label><span>كلمة السر الحالية</span><input name="currentPassword" type="password" required minlength="8" /></label>
          <label><span>كلمة السر الجديدة</span><input name="newPassword" type="password" required minlength="8" /></label>
          <label><span>تأكيد كلمة السر الجديدة</span><input name="confirmPassword" type="password" required minlength="8" /></label>

          <button type="submit" class="btn btn-primary" id="passwordBtn">تغيير كلمة السر</button>
          <p class="msg" id="passwordMsg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <!-- ===== Section: orders ===== -->
    <section class="section" data-section="orders">
      <div class="panel">
        <div class="panel-head"><h2>طلباتي</h2></div>
        <div id="ordersList" class="list">
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
        </div>
        <div id="ordersEmpty" class="empty hidden">
          <p>لا توجد طلبات بعد.</p>
        </div>
      </div>
    </section>

    <!-- ===== Section: results ===== -->
    <section class="section" data-section="results">
      <div class="panel">
        <div class="panel-head">
          <h2>نتائجي</h2>
          <a href="/result" class="btn btn-outline btn-sm">عرض الكل</a>
        </div>
        <div id="resultsList" class="list">
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
        </div>
        <div id="resultsEmpty" class="empty hidden">
          <p>لا توجد نتائج بعد.</p>
        </div>
      </div>
    </section>

    <!-- ===== Section: visits ===== -->
    <section class="section" data-section="visits">
      <div class="panel">
        <div class="panel-head">
          <h2>زياراتي المنزلية</h2>
          <a href="/book-visit" class="btn btn-outline btn-sm">حجز جديد</a>
        </div>
        <div id="visitsList" class="list">
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
        </div>
        <div id="visitsEmpty" class="empty hidden">
          <p>لا توجد زيارات بعد.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 فاليو لاب — Value Lab. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <!-- ===== Scripts ===== -->
  <script src="/public/js/core/auth-guard.js"></script>
  <script src="/public/js/profile.js" defer></script>
</body>
</html>
