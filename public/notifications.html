<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="تابع كل إشعاراتك من فاليو لاب." />
  <meta name="theme-color" content="#1a222c" />
  <title>الإشعارات | فاليو لاب - Value Lab</title>
  <link rel="icon" href="https://i.ibb.co/Q32HdtCF/image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/notifications.css" />
</head>
<body>

  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand">
        <img src="https://i.ibb.co/Q32HdtCF/image.jpg" alt="Value Lab" class="brand-logo" />
        <span class="brand-name">فاليو لاب<small>Value Lab</small></span>
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="القائمة" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav-links" id="navLinks">
        <a href="/">الرئيسية</a>
        <a href="/testspackages">التحاليل</a>
        <a href="/result">النتائج</a>
        <a href="/points">النقاط</a>
        <a href="/profile">حسابي</a>
        <button class="btn btn-outline" id="logoutBtn" type="button">خروج</button>
      </nav>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <main class="container main">

    <div class="page-head">
      <div>
        <h1>الإشعارات</h1>
        <p class="sub">كل التحديثات والتنبيهات الخاصة بحسابك.</p>
      </div>

      <div class="head-actions">
        <select id="typeFilter" aria-label="فلترة النوع">
          <option value="">كل الأنواع</option>
          <option value="RESULT_READY">نتيجة جاهزة</option>
          <option value="ORDER_CREATED">طلب جديد</option>
          <option value="HOME_VISIT_CONFIRMED">تأكيد زيارة</option>
          <option value="HOME_VISIT_ASSIGNED">تعيين موظف</option>
          <option value="PASSWORD_RESET">إعادة كلمة السر</option>
          <option value="GENERAL">عام</option>
        </select>

        <button class="btn btn-outline" id="markAllReadBtn" type="button">تعليم الكل كمقروء</button>
      </div>
    </div>

    <!-- Summary -->
    <div class="summary" id="summary">
      <span class="summary-chip">
        <span class="dot unread"></span>
        <span id="unreadCount">—</span> غير مقروء
      </span>
      <span class="summary-chip">
        <span class="dot read"></span>
        <span id="readCount">—</span> مقروء
      </span>
    </div>

    <!-- List -->
    <section id="notifList" class="notif-list" aria-live="polite">
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </section>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state hidden">
      <h3>لا توجد إشعارات</h3>
      <p>لما يحصل أي تحديث على حسابك، هيظهر هنا تلقائيًا.</p>
    </div>

    <!-- Load more -->
    <div class="load-more-wrap hidden" id="loadMoreWrap">
      <button class="btn btn-outline" id="loadMoreBtn" type="button">تحميل المزيد</button>
    </div>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 فاليو لاب — Value Lab. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <!-- ===== Scripts ===== -->
  <script src="/public/js/core/auth-guard.js"></script>
  <script src="/public/js/notifications.js" defer></script>
</body>
</html>
