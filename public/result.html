<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="تابع نتائج تحاليلك من فاليو لاب." />
  <meta name="theme-color" content="#1a222c" />
  <title>نتائج التحاليل | فاليو لاب - Value Lab</title>
  <link rel="icon" href="https://i.ibb.co/Q32HdtCF/image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/result.css" />
</head>
<body>

  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand">
        <img src="https://i.ibb.co/Q32HdtCF/image.jpg" alt="Value Lab" class="brand-logo" />
        <span class="brand-name">فاليو لاب<small>Value Lab</small></span>
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="القائمة" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav-links" id="navLinks">
        <a href="/">الرئيسية</a>
        <a href="/testspackages">التحاليل</a>
        <a href="/result" class="active">النتائج</a>
        <a href="/points">النقاط</a>
        <a href="/profile">حسابي</a>
        <button class="btn btn-outline" id="logoutBtn" type="button">خروج</button>
      </nav>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <main class="container main">

    <div class="page-head">
      <div>
        <h1>نتائج التحاليل</h1>
        <p class="sub">هنا تظهر نتائجك المعتمدة من المعمل.</p>
      </div>

      <div class="filters">
        <label class="search">
          <span class="sr-only">ابحث في النتائج</span>
          <input id="searchInput" type="search" placeholder="ابحث باسم التحليل..." autocomplete="off" />
        </label>

        <select id="statusFilter" aria-label="فلترة الحالة">
          <option value="">كل الحالات</option>
          <option value="READY">جاهزة</option>
          <option value="PROCESSING">قيد التحليل</option>
          <option value="PENDING">في الانتظار</option>
          <option value="VIEWED">تم الاطلاع</option>
        </select>
      </div>
    </div>

    <!-- Results container -->
    <section id="resultsList" class="results-list" aria-live="polite">
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </section>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state hidden">
      <h3>لا توجد نتائج</h3>
      <p>لسه مفيش نتائج متاحة لحسابك. لما يتم اعتماد نتيجتك هتظهر هنا تلقائيًا.</p>
    </div>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 فاليو لاب — Value Lab. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

<script src="/public/js/core/auth-guard.js"></script>
<script src="/public/js/result.js" defer></script>
</body>
</html>
